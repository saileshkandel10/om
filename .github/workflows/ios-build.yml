name: iOS Build

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
          - profile

jobs:
  build-ios:
    name: Build iOS (${{ github.event.inputs.build_type || 'release' }})
    runs-on: macos-15
    defaults:
      run:
        working-directory: om_connect

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true
          cache-path: ${{ runner.tool_cache }}/flutter

      - name: Show Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      # Code generation skipped - generated files are already committed

      - name: Analyze code
        run: flutter analyze --no-fatal-infos || true

      - name: Run tests
        run: flutter test --no-pub

      - name: Build iOS app
        run: |
          if [ "${{ github.event.inputs.build_type || 'release' }}" = "debug" ]; then
            flutter build ios --debug --no-pub
          elif [ "${{ github.event.inputs.build_type || 'release' }}" = "profile" ]; then
            flutter build ios --profile --no-pub
          else
            flutter build ios --release --no-pub
          fi

      - name: Prepare artifact directory
        run: mkdir -p ${{ github.workspace }}/artifacts

      - name: Collect IPA
        run: |
          SRC="build/ios/iphoneos/Runner.app"
          if [ ! -d "$SRC" ]; then
            echo "Error: built app not found at $SRC"
            exit 1
          fi
          # Package the .app bundle into an IPA (flat structure: Payload/Runner.app)
          mkdir -p ${{ github.workspace }}/artifacts/Payload
          cp -R "$SRC" ${{ github.workspace }}/artifacts/Payload/Runner.app
          cd ${{ github.workspace }}/artifacts
          zip -r om_connect-${{ github.event.inputs.build_type || 'release' }}.ipa Payload
          echo "IPA created at: ${{ github.workspace }}/artifacts/om_connect-${{ github.event.inputs.build_type || 'release' }}.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: om-connect-ios-${{ github.event.inputs.build_type || 'release' }}-${{ github.sha }}
          path: ${{ github.workspace }}/artifacts/om_connect-${{ github.event.inputs.build_type || 'release' }}.ipa
          retention-days: 30

      - name: Create GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ github.workspace }}/artifacts/om_connect-${{ github.event.inputs.build_type || 'release' }}.ipa
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}